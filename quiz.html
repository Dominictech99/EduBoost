<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lesson Quiz | EduBoost</title>

    <link rel="stylesheet" href="css/quiz.css">

</head>

<body>

<div class="quiz-container">

    <div class="quiz-header">

        <h1 id="quizTitle">
            Mathematics Quiz
        </h1>

        <div class="quiz-info">

            <span id="questionCounter">
                Question 1 of 10
            </span>

            <span id="quizTimer">
                ⏱ 15:00
            </span>

        </div>

    </div>

    <div class="quiz-card">

        <h2 id="questionText">

            Loading Question...

        </h2>

        <div id="answersContainer">

        </div>

    </div>

    <div class="quiz-navigation">

        <button id="previousQuestion">

            Previous

        </button>

        <button id="nextQuestion">

            Next

        </button>

        <button id="submitQuiz">

            Submit Quiz

        </button>

    </div>

</div>

<script src="js/quiz.js"></script>

</body>

</html>
