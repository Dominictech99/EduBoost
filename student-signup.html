<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Signup | EduBoost</title>

<link rel="stylesheet" href="css/login.css">

</head>


<body>


<div class="login-container">


<h1>
Create EduBoost Account
</h1>



<form id="signupForm">


<input 
type="text"
id="name"
placeholder="Full Name"
required>



<input 
type="email"
id="email"
placeholder="Email Address"
required>



<input 
type="password"
id="password"
placeholder="Password"
required>



<select id="level">


<option value="">
Select Class Level
</option>


<option value="JSS1">
JSS1
</option>


<option value="JSS2">
JSS2
</option>


<option value="JSS3">
JSS3
</option>


<option value="SS1">
SS1
</option>


<option value="SS2">
SS2
</option>


<option value="SS3">
SS3
</option>


</select>




<button type="submit">

Create Account

</button>



</form>



<p id="message"></p>


</div>




<script src="js/signup.js"></script>


</body>

</html>
