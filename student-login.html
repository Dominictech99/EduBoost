<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | EduBoost</title>

    <link rel="stylesheet" href="css/login.css">

</head>


<body>


<div class="login-container">


    <h1>
        EduBoost Student Login
    </h1>


    <form id="loginForm">


        <input 
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
        required>


        <input 
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="new-password"
        required>

        <p class="forgot-password">
  <a href="forgot-password.html">Forgot Password?</a>
</p>


        <button type="submit">
            Login
        </button>


    </form>


    <p id="message"></p>


</div>



<script src="js/student-login.js"></script>

</body>

</html>
